# BlueyOS Password & Lockout Policy
# /etc/security/pwpolicy.conf
#
# Lines beginning with '#' are comments.
# Format: KEY = VALUE  (whitespace around '=' is allowed)

# ---------------------------------------------------------------------------
# Password Complexity
# ---------------------------------------------------------------------------

# Minimum total length of new passwords
MIN_LENGTH = 8

# Minimum number of uppercase letters (A-Z)
MIN_UPPERCASE = 1

# Minimum number of lowercase letters (a-z)
MIN_LOWERCASE = 1

# Minimum number of digits (0-9)
MIN_DIGITS = 1

# Minimum number of special (non-alphanumeric) characters
MIN_SPECIAL = 1

# How many previous password hashes to remember per user.
# Prevents reuse of recent passwords. Set to 0 to disable history checks.
HISTORY = 5

# ---------------------------------------------------------------------------
# Account Lockout
# ---------------------------------------------------------------------------

# Number of failed login attempts before the account is locked.
# Set to 0 to disable lockout.
MAX_ATTEMPTS = 5

# How long (in seconds) to keep the account locked after MAX_ATTEMPTS is
# reached. After this duration, fresh attempts are allowed again.
# Set to 0 for permanent lockout (requires manual unlock with userlock -u).
LOCKOUT_TIME = 300

# How long (in seconds) after the most recent failure before the failure
# counter is silently reset to zero (i.e., forgive old failures).
# Set to 0 to never reset automatically.
LOCKOUT_RESET_TIME = 900
